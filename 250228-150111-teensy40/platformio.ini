[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = 
	mbed-bxd/Adafruit_PWMServoDriver @ 0.0.0+sha.41a00db32ae7
	arduino-libraries/Servo@^1.2.2
